<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Discovery Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workshop table — sticky step rail on top, one working surface per step, card detail opens as a side sheet. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#d8dee8; --fg:#18202c; --muted:#5a6678;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e3ecfa;
  --good:#1d7a4f; --good-soft:#e1f3ea; --warn:#a1620b; --warn-soft:#fbf0dc; --bad:#9b3434; --bad-soft:#f8e5e5;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --c-agentic:#4f6f86; --c-info:#2f6bab; --c-data:#2c7a82; --c-task:#5d6470; --c-decision:#8a6a3c; --c-visual:#6a58a8;
  --c-text:#a35a3a; --c-comm:#a83f4a; --c-speech:#8e4a91; --c-env:#3d7f4c; --c-content:#7d63b8; --c-process:#3f5f95; --c-nav:#9a7230;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --surface-2:#151a22; --line:#2c3542; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6ea2ef; --accent-ink:#0d1420; --accent-soft:#1d2c44;
  --good:#5cc495; --good-soft:#163428; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3d1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --c-agentic:#86a7bf; --c-info:#6ea2e0; --c-data:#5fb3ba; --c-task:#9aa3b0; --c-decision:#c9a46e; --c-visual:#a796e0;
  --c-text:#e09272; --c-comm:#e57d88; --c-speech:#c98bcc; --c-env:#79bd88; --c-content:#b59ee8; --c-process:#86a3d6; --c-nav:#d8ad62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --surface-2:#151a22; --line:#2c3542; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6ea2ef; --accent-ink:#0d1420; --accent-soft:#1d2c44;
  --good:#5cc495; --good-soft:#163428; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3d1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --c-agentic:#86a7bf; --c-info:#6ea2e0; --c-data:#5fb3ba; --c-task:#9aa3b0; --c-decision:#c9a46e; --c-visual:#a796e0;
  --c-text:#e09272; --c-comm:#e57d88; --c-speech:#c98bcc; --c-env:#79bd88; --c-content:#b59ee8; --c-process:#86a3d6; --c-nav:#d8ad62;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header + steps */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand .cust{color:var(--muted);font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.tally span{font-family:var(--f-mono);font-size:.78rem;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
nav.steps{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{flex:0 0 auto;border:0;background:none;padding:9px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:7px;align-items:center}
nav.steps button .n{font-family:var(--f-mono);font-size:.75rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
nav.steps button[aria-current="step"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{padding-top:22px}
section.view{display:grid;gap:18px}
.intro{display:grid;gap:6px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--fg);padding:10px 14px;border-radius:var(--r)}
.banner b{color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* forms */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.scale{display:flex;gap:4px}
.scale button{width:34px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--f-mono)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* discover */
.qgrid{display:grid;gap:14px}
.q h3{margin-bottom:4px}
.q p{margin-bottom:10px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rec{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.rec .why{font-size:.8rem;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* deck */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{max-width:280px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc,var(--muted));margin-right:6px;vertical-align:1px}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;display:grid;grid-template-rows:auto 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.card .tab{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:color-mix(in srgb,var(--cc) 16%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--cc) 30%,var(--line));font-size:.76rem;font-weight:600;color:var(--fg)}
.card .tab .no{font-family:var(--f-mono);color:var(--muted);font-weight:400}
.card .body{padding:12px;display:grid;gap:6px;align-content:start;cursor:pointer;text-align:left;border:0;background:none}
.card .body h3{font-size:1.06rem}
.card .body p{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .acts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.card .acts button{border:0;background:none;padding:8px 4px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted)}
.card .acts button+button{border-left:1px solid var(--line)}
.card .acts button.on.p{background:var(--good-soft);color:var(--good)}
.card .acts button.on.m{background:var(--warn-soft);color:var(--warn)}
.card .acts button.on.x{background:var(--bad-soft);color:var(--bad)}
.card.st-p{border-color:var(--good)} .card.st-m{border-color:var(--warn)} .card.st-x{opacity:.62}
.card .flag{font-size:.7rem;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.sheet-grid img{width:100%;border-radius:10px;box-shadow:var(--shadow);display:block;background:var(--surface-2);aspect-ratio:552/768}
.ex{display:grid;gap:8px}
.ex div{font-size:.9rem}
.ex b{font-weight:600}
.prods{display:flex;flex-wrap:wrap;gap:5px}
.prod{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--surface)}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.st{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.st.p[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.st.m[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st.x[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.suggest{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
@media (max-width:760px){.sheet-grid{grid-template-columns:1fr}.sheet-grid img{max-width:280px}}

/* requirements list */
.reqlist{display:grid;gap:10px}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.req .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 8px;border:1px solid var(--line)}
.pill.p{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.m{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.todo{color:var(--muted)}

/* matrix */
.mx-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.mx-wrap{grid-template-columns:1fr}}
svg.mx{width:100%;height:auto;display:block}
svg.mx text{fill:var(--muted);font-family:var(--f-body)}
svg.mx .ql{font-size:12px;font-weight:600;fill:var(--fg);opacity:.75}
svg.mx .dot-l{font-size:11px;fill:var(--fg);font-family:var(--f-mono)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.86rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.num{font-family:var(--f-mono);text-align:center}
.quad{font-size:.75rem;font-weight:600;white-space:nowrap}
.q-quick{color:var(--good)} .q-strat{color:var(--accent)} .q-fill{color:var(--warn)} .q-later{color:var(--muted)}

/* deck cut, processes, solutions */
.fams{display:grid;gap:8px}
.fam{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface-2)}
.fam-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fam-n{font-weight:600;font-size:.9rem}
.fam-stage{position:relative;min-width:0}
.fam-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;scrollbar-width:thin}
.fam-track .cut-tile{flex:0 0 min(78vw,340px);scroll-snap-align:start}
.fam-stage .gal-arrow.prev{left:6px} .fam-stage .gal-arrow.next{right:6px}
.cut-tile{position:relative}
.cut-img{display:block;width:100%;aspect-ratio:552/768;padding:0;border:2px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;cursor:pointer}
.cut-img img{width:100%;height:100%;display:block;object-fit:cover}
.cut-img[aria-pressed="true"]{border-color:var(--accent)}
.cut-img[aria-pressed="false"] img{opacity:.3;filter:grayscale(1)}
.cut-box{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);color:var(--accent-ink);display:grid;place-items:center;font-size:1.1rem;font-weight:700;line-height:1;pointer-events:none}
.cut-img[aria-pressed="true"]~.cut-box{background:var(--accent);border-color:var(--accent)}
.cut-img[aria-pressed="true"]~.cut-box::before{content:"✓"}
.cut-zoom{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;font-size:1rem;line-height:1}
.cut-zoom:hover{border-color:var(--accent)}
.procs{display:grid;gap:10px}
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.proc .btn{justify-self:start}
.card .home{font-size:.78rem;color:var(--good);font-weight:600}
.card .home.none{color:var(--warn)}
.card .acts.one{grid-template-columns:1fr}
.sheet.narrow{width:min(780px,100%)}
.stackcards{display:flex;flex-wrap:wrap;gap:5px}
.tagc{font-size:.76rem;border:1px solid color-mix(in srgb,var(--cc) 40%,var(--line));background:color-mix(in srgb,var(--cc) 12%,var(--surface));border-radius:6px;padding:2px 7px}
.tagc.pat{font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tagrows{display:grid;gap:8px;font-size:.84rem}
details>summary{cursor:pointer;font-weight:600;font-size:.88rem}
.panel.decision{border-color:var(--accent)}
.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.78rem}
/* local AI */
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:middle}
.ai-dot.on{background:var(--good)} .ai-dot.off{background:var(--warn)}
.ai-box{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;background:var(--accent-soft);font-size:.88rem;display:grid;gap:6px;white-space:pre-wrap}
.ai-box .label{white-space:normal}
.ai-panel{display:grid;gap:12px;border-color:var(--accent)}
.ai-note{font-size:.8rem;color:var(--muted)}
.sheet code,.ai-panel code{font-family:var(--f-mono);font-size:.82em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* card carousel */
.gal{--gw:min(76vw,calc(min(66dvh,640px)*552/768));position:fixed;inset:0;z-index:41;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + 18px)}
.gal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-inline:18px}
.gal-h>div:first-child{display:grid;gap:4px;min-width:0}
.gal-stage{position:relative;min-height:0;display:grid}
.gal-track{display:flex;align-items:center;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative}
.gal-track::-webkit-scrollbar{display:none}
.gal-track::before,.gal-track::after{content:"";flex:0 0 calc(50% - var(--gw)/2 - 18px)}
.gal-item{flex:0 0 auto;width:var(--gw);aspect-ratio:552/768;margin:0;padding:0;border:0;background:none;scroll-snap-align:center;cursor:pointer;border-radius:12px;transform:scale(.86);opacity:.5}
.gal-item.on{transform:none;opacity:1;cursor:default}
.gal-item img{width:100%;height:100%;display:block;border-radius:12px;box-shadow:var(--shadow);background:var(--surface-2)}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:1;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-size:1.4rem;line-height:1;display:grid;place-items:center}
.gal-arrow:hover{border-color:var(--accent)}
.gal-arrow:disabled{opacity:.35;cursor:default}
.gal-arrow.prev{left:12px} .gal-arrow.next{right:12px}
.gal-f{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding-inline:18px}
@media (prefers-reduced-motion:no-preference){.gal-item{transition:transform .2s ease-out,opacity .2s ease-out}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="brand-l"><h1>Agent Discovery Deck</h1><span class="cust" id="hdrCust"></span></div>
      <div class="row"><div class="tally" id="tally"></div><button type="button" class="btn sm" data-act="gallery">View all cards</button><button type="button" class="btn sm" data-act="aiSettings" id="aiBtn" title="AI drafting with a model running on this PC"><span class="ai-dot"></span>Local AI</button></div>
    </div>
    <nav class="steps" id="steps" aria-label="Workshop steps"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div id="sheetHost"></div>

function cardTier(c){
  const p = c.products.join("|");
  if(/Microsoft 365 Copilot/.test(p)) return 0;
  if(/Copilot Studio|Agents SDK/.test(p)) return 1;
  if(/Power Platform/.test(p)) return 2;
  return 3;
}
function stackCards(s){return [s.pattern,...s.cards].map(id=>byId[id]).filter(Boolean)}
function suggestTier(s){
  const cs = stackCards(s);
  if(!cs.length) return [0,"Add cards to the stack to get a suggestion."];
  const t = Math.max(...cs.map(cardTier));
  if(t===0) return [0,"Every card in the stack is tagged Microsoft 365 Copilot, so start out of the box."];
  return [t,"The simplest tier that covers every card. Needed for: "+cs.filter(c=>cardTier(c)===t).map(c=>c.id+" "+c.title).join(", ")+"."];
}
function tierOf(s){return s.tier||TIERS[suggestTier(s)[0]]}

/* Fills gaps in a saved workshop, and turns the older one-card requirements into single-card solutions */
function normalize(o){
  const b=blankState();
  o.customer=Object.assign(b.customer,o.customer||{});
  o.answers=Object.assign(b.answers,o.answers||{});
  o.sort=o.sort||{}; o.where=o.where||{};
  o.cut=Array.isArray(o.cut)?o.cut:[]; o.processes=Array.isArray(o.processes)?o.processes:[];
  o.pilot=Object.assign(b.pilot,o.pilot||{});
  if(!Array.isArray(o.stacks)){
    o.stacks=[];
    Object.keys(o.reqs||{}).forEach(k=>{const r=o.reqs[k], c=byId[k]; if(!c||!r||!(o.sort[k]==="p"||o.sort[k]==="m")||!(r.problem||r.value)) return;
      const agentic=c.category==="Agentic";
      o.stacks.push(Object.assign(blankStack(),{name:r.name||"",pattern:agentic?c.id:null,cards:agentic?[]:[c.id],who:r.users||"",knowledge:r.knowledge||[],action:r.actions||"",measure:r.success||"",
        value:r.value||0,feas:r.complexity?6-r.complexity:0,sponsor:r.sponsor||"",notes:[r.problem,r.notes].filter(Boolean).join("\n")}))});
  }
  o.stacks=o.stacks.map(s=>Object.assign(blankStack(),s));
  delete o.reqs;
  return o;
}

function decidedLabel(){return decided()?"Decision agreed":"Needs a pilot, a success measure and the next meeting"}
function matrixSVG(items){
  const W=520,H=400,L=46,T=16,R=14,B=44,pw=W-L-R,ph=H-T-B;
  const x=v=>L+(v-0.5)/5*pw, y=v=>T+(5.5-v)/5*ph;
  const seen={}; const pts=items.map((s,i)=>{const k=s.value+"-"+s.feas;const n=seen[k]=(seen[k]||0)+1;const a=(n-1)*2.1;const off=n>1?11:0;return {i,cx:x(s.feas)+Math.cos(a)*off,cy:y(s.value)+Math.sin(a)*off,s}});
  return `<svg class="mx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Value versus feasibility matrix">
   <rect x="${L}" y="${T}" width="${x(3.5)-L}" height="${y(3.5)-T}" fill="var(--accent-soft)"/>
   <rect x="${x(3.5)}" y="${T}" width="${L+pw-x(3.5)}" height="${y(3.5)-T}" fill="var(--good-soft)"/>
   <rect x="${L}" y="${y(3.5)}" width="${x(3.5)-L}" height="${T+ph-y(3.5)}" fill="var(--surface-2)"/>
   <rect x="${x(3.5)}" y="${y(3.5)}" width="${L+pw-x(3.5)}" height="${T+ph-y(3.5)}" fill="var(--warn-soft)"/>
   <text class="ql" x="${L+8}" y="${T+18}">Strategic bets</text><text class="ql" x="${L+pw-8}" y="${T+18}" text-anchor="end">Pilot candidates</text>
   <text class="ql" x="${L+8}" y="${T+ph-8}">Not yet</text><text class="ql" x="${L+pw-8}" y="${T+ph-8}" text-anchor="end">Fill-ins</text>
   ${[1,2,3,4,5].map(v=>`<text x="${x(v)}" y="${T+ph+16}" text-anchor="middle" font-size="11">${v}</text><text x="${L-10}" y="${y(v)+4}" text-anchor="end" font-size="11">${v}</text>`).join("")}
   <line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="var(--line)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="var(--line)"/>
   <text x="${L+pw/2}" y="${H-6}" text-anchor="middle" font-size="12">Feasibility →</text>
   <text transform="translate(13 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="12">Value →</text>
   ${pts.map(p=>{const pilot=S.pilot.stack===p.s.id;return `<g style="cursor:pointer" data-ostack="${p.s.id}">${pilot?`<circle cx="${p.cx}" cy="${p.cy}" r="15" fill="none" stroke="var(--good)" stroke-width="2"/>`:""}<circle cx="${p.cx}" cy="${p.cy}" r="10" fill="var(${CAT[byId[p.s.pattern]?.category]||"--accent"})" stroke="var(--surface)" stroke-width="2"><title>${esc(stackName(p.s))}${pilot?" (the pilot)":""}</title></circle><text class="dot-l" x="${p.cx}" y="${p.cy+4}" text-anchor="middle" style="fill:#fff;font-size:10px">${p.i+1}</text></g>`}).join("")}
  </svg>`;
}

/* Small models wrap JSON in prose or return several objects, so take the first complete object */
function aiJSON(txt){
  const a=txt.indexOf("{"); if(a<0) throw new Error("no JSON in reply");
  let depth=0, str=false, esc1=false;
  for(let i=a;i<txt.length;i++){const ch=txt[i];
    if(str){if(esc1)esc1=false;else if(ch==="\\")esc1=true;else if(ch==='"')str=false;continue}
    if(ch==='"')str=true;else if(ch==="{")depth++;else if(ch==="}"&&--depth===0)return JSON.parse(txt.slice(a,i+1));}
  throw new Error("unfinished JSON in reply");
}

  finally{aiBusy=""; refreshUI()}
}

async function aiDiscover(){
  const deck=inDeck(), brief=deck.length>40, ids=new Set(deck.map(c=>c.id)), seen=new Set();
  const list=deck.map(c=>`${c.id}. ${c.title}${brief?"":`: ${c.description.slice(0,90)}`}`).join("\n");
  const j=aiJSON(await aiChat(AI_SYS+" Reply with JSON only.",
    `${aiContext()}\n\nCards in the deck:\n${list}\n\nPick up to 6 cards from the deck that best fit this customer's processes and pains. For each give the card id, the process label (such as P1) it fits or "", and one short sentence on why it fits that names their process or pain rather than repeating the card. Reply as {"suggestions":[{"id":0,"process":"P1","why":"..."}]}`,500));
  const out=(j.suggestions||[]).map(x=>({id:+x.id,proc:procFromLabel(x.process),why:f(x.why)})).filter(x=>ids.has(x.id)&&!seen.has(x.id)&&seen.add(x.id)).slice(0,6);
  if(!out.length) throw new Error("no usable suggestions");
  aiOut.discover=out;
}
async function aiWhere(id){
  const c=byId[id];
  const j=aiJSON(await aiChat(AI_SYS+" Reply with JSON only.",
    `${aiContext()}\n\nCard ${c.id}: ${c.title}. ${c.description}\n\nSay where this card would happen for this customer: the process label (P1, P2…) it fits best, or "" if none fits, and one short line naming the team and the volume, using the figures given where you can. Reply as {"process":"P1","detail":"Team, volume"}`,150));
  const w=S.where[id]=S.where[id]||{proc:"",detail:""}, pid=procFromLabel(j.process);
  if(pid) w.proc=pid; if(f(j.detail)) w.detail=f(j.detail).slice(0,160);
  touched(); toast("Drafted. Check it with the customer.");
}
async function aiExplain(id){
  const c=byId[id];
  aiOut.explain[id]=await aiChat(AI_SYS,
    `${aiContext()}\n\nCard ${c.id}: ${c.title}\n${c.description}\nExamples: ${c.examples.map(e=>e.sector+": "+e.text).join(" ")}\n\nIn two or three sentences, explain what this card could do for this customer, tied to one of their processes if one fits. Name processes in words, never by labels such as P1. No preamble.`,220);
}
const AI_FIELDS=["who","trigger","action","hitl","measure","risk"];
async function aiQualify(sid){
  const s=stackById(sid); if(!s) return;
  const pr=procById(s.proc), done=AI_FIELDS.filter(k=>f(s[k])).map(k=>`${k}: ${s[k]}`).join("; ");
  const c=S.customer;
  const j=aiJSON(await aiChat(AI_SYS+" Reply with one JSON object only.",
    `Customer: ${f(c.name)||"unnamed"}${f(c.sector)?` (${c.sector})`:""}\n${f(c.goals)?"Goals: "+c.goals+"\n":""}\nThis is ONE solution. Solution: ${stackName(s)}\nProcess: ${pr?[procLabel(pr),f(pr.team)&&"team "+pr.team,f(pr.owner)&&"owner "+pr.owner,f(pr.volume)&&"volume "+pr.volume].filter(Boolean).join("; "):"not chosen"}\nCards: ${stackCards(s).map(c=>`${c.title} (${c.description.slice(0,80)})`).join("; ")}\n${done?"Already agreed: "+done+"\n":""}\nDraft one short line for each qualifying question. who: the user or persona. trigger: what starts it. action: what the agent does or produces. hitl: where a person approves. measure: time or cost saved. risk: the data and processes it touches. riskLevel must be Low, Medium or High. Reply with a single object for this one solution, as {"name":"","who":"","trigger":"","action":"","hitl":"","measure":"","risk":"","riskLevel":""}`,400));
  const t=stackById(sid); if(!t) return; let n=0;
  if(!f(t.name)&&f(j.name)){t.name=f(j.name).slice(0,80);n++}
  AI_FIELDS.forEach(k=>{if(!f(t[k])&&f(j[k])){t[k]=f(j[k]).slice(0,200);n++}});
  if(!t.riskLevel&&RISK_LEVELS.includes(f(j.riskLevel))){t.riskLevel=f(j.riskLevel);n++}
  touched(); toast(n?`Filled ${n} empty line${n>1?"s":""}. Check them with the customer.`:"Nothing was left empty to fill.");
}
async function aiEmail(){
  const p=S.pilot, s=stackById(p.stack), c=S.customer;
  aiOut.email=await aiChat(AI_SYS,
    `Customer: ${f(c.name)||"the customer"}${f(c.sector)?` (${c.sector})`:""}\nAttendees: ${f(c.attendees)||"-"}\nGoals: ${f(c.goals)||"-"}\nPilot: ${s?stackName(s)+" — "+[s.action,s.who].filter(f).join("; "):"not agreed yet"}\nDelivery: ${s?tierOf(s):"-"}\nSuccess measure: ${f(p.measure)||"-"}\nCustomer owner: ${f(p.owner)||"-"}\nNext meeting: ${[p.nextDate,p.nextStep].filter(f).join(", ")||"-"}\nFunding: ${[p.funding,p.fundingNote].filter(f).join(", ")||"-"}\nOther solutions discussed: ${S.stacks.filter(x=>x!==s).map(stackName).join(", ")||"none"}\n\nWrite a short follow-up email from the partner to the customer after the workshop. Thank them, restate the pilot, the success measure, the owner and the next meeting, and list two or three things to bring to it. Under 180 words, plain text, starting with a "Subject:" line. Don't add a signature name.`,450);
}
function aiAction(k){
  if(!aiReady()){openAISheet();return}
  const id=openId, sid=openStackId;
  if(k==="discover"){if(!S.processes.some(p=>f(p.name))&&!QUESTIONS.some(q=>(S.answers[q.key]||[]).length)){toast("Write down a process or tag an answer first");return} aiRun(k,aiDiscover)}
  if(k==="where"&&id!=null) aiRun(k,()=>aiWhere(id));
  if(k==="explain"&&id!=null) aiRun(k,()=>aiExplain(id));
  if(k==="qualify"&&sid){if(!stackCards(stackById(sid)).length){toast("Pick the pattern and capability cards first");return} aiRun(k,()=>aiQualify(sid))}
  if(k==="email"){if(!stackById(S.pilot.stack)){toast("Choose the pilot first");return} aiRun(k,aiEmail)}
}
function aiDiscoverPanel(){
  if(!aiReady()) return "";
  const out=aiOut.discover;
  return `<div class="panel ai-panel"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="display:grid;gap:4px;max-width:70ch"><h3>Local AI suggestions</h3><p class="muted" style="font-size:.88rem">Reads the processes and answers above and picks cards from the deck. It runs on this PC through Foundry Local, so nothing leaves the room.</p></div>${aiBtn("discover",out?"Suggest again":"Suggest cards","btn primary")}</div>
   ${out?`<div class="recs">${out.map(r=>{const c=byId[r.id], pr=procById(r.proc);return `<div class="rec" style="--cc:var(${CAT[c.category]})">
     <div class="row" style="justify-content:space-between"><span class="label"><span class="cat-dot"></span>${esc(c.category)}</span><span class="score">No. ${c.id}</span></div>
     <h3>${esc(c.title)}</h3>${r.why?`<p class="muted" style="font-size:.86rem">${esc(r.why)}</p>`:""}${pr?`<div class="why">Fits: ${esc(procLabel(pr))}</div>`:""}
     <div class="row"><button class="btn sm" data-open="${c.id}">Open card</button>${statusMini(c.id)}</div></div>`}).join("")}</div>`:""}</div>`;
}
function openAISheet(){
  aiSheetOn=true; openId=null; openStackId=null;
  const st={ready:"Connected",offline:"Not reachable",checking:"Checking…",off:"Off"}[aiState];
  $("#sheetHost").innerHTML=`<div class="scrim" data-close></div><div class="sheet narrow" role="dialog" aria-modal="true" aria-label="Local AI">
   <div class="sheet-h"><span class="label">Local AI · Foundry Local</span><button class="btn sm" data-close>Close</button></div>
   <div style="display:grid;gap:16px">
    <p class="muted">Adds AI drafting to the deck with a small language model, such as Phi-4-mini, running on this PC. Workshop details go only to the address below and never to the cloud.</p>
    <div class="panel" style="display:grid;gap:12px">
     <div class="field"><label for="ai-url">Foundry Local address</label><input type="text" id="ai-url" data-ai="url" value="${esc(AI.url)}" placeholder="http://127.0.0.1:58017" spellcheck="false" autocomplete="off"><span class="hint">Run <code>foundry status</code> and copy the Web URL. It can change when Foundry restarts.</span></div>
     ${aiModels.length?`<div class="field"><label for="ai-model">Model</label><select id="ai-model">${aiModels.map(m=>`<option ${m===AI.model?"selected":""}>${esc(m)}</option>`).join("")}</select><span class="hint">Phi-4-mini is the default. Load a model first with <code>foundry model load</code>.</span></div>`:""}
     <div class="row"><button class="btn primary" data-act="aiConnect" ${aiState==="checking"?"disabled":""}>${aiReady()?"Reconnect":"Connect"}</button>${AI.on?`<button class="btn ghost" data-act="aiOff">Turn off</button>`:""}<span class="pill ${aiReady()?"ok":aiState==="offline"?"warn":"todo"}">${st}</span></div>
     ${aiMsg?`<p class="muted" style="font-size:.86rem">${esc(aiMsg)}</p>`:""}
    </div>
    <div class="panel" style="display:grid;gap:10px"><h3>Set it up</h3>
     <ol style="margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.88rem">
      <li>Install Foundry Local: <code>winget install Microsoft.FoundryLocal</code></li>
      <li>Load the model: <code>foundry model load phi-4-mini</code></li>
      <li>Run <code>foundry status</code>, paste the Web URL above and press Connect. Allow the browser's local network prompt if it asks.</li></ol>
     <p class="muted" style="font-size:.86rem">Then look for the ✦ buttons in Discover, on each card, in each solution and in Pilot. Everything the AI drafts is a starting point to check with the customer.</p></div>
   </div></div>`;
  document.body.style.overflow="hidden";
}

/* ---------- events ---------- */
function setPilot(id){
  S.pilot.stack=id; const s=stackById(id);
  if(s){if(!f(S.pilot.measure)) S.pilot.measure=s.measure; if(!f(S.pilot.owner)) S.pilot.owner=s.sponsor;}
  touched(); render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-open],[data-ostack],[data-set],[data-restore],[data-q],[data-cat],[data-close],[data-nav],[data-sset],[data-fam],[data-famopen],[data-cutcard],[data-delproc],[data-spat],[data-scard],[data-schip],[data-sone],[data-sscale],[data-pilot],[data-fund],[data-gal],[data-gi],[data-zoom],[data-famscroll],[data-aiact]");
  if(!t) return;
  const d=t.dataset;
  if(d.go){go(d.go);return}
  if(d.aiact){aiAction(d.aiact);return}
  if(d.act==="aiSettings"){openAISheet();return}
  if(d.act==="aiConnect"){aiConnect();return}
  if(d.act==="aiOff"){AI.on=false;saveAI();aiState="off";aiMsg="";refreshUI();return}
  if(d.act==="copyEmail"){copy(f(($("#aiEmail")||{}).value)||aiOut.email,"Email");return}
  if(d.gal){galGo(galIdx+ +d.gal);return}
  if(d.gi){galGo(+d.gi);return}
  if(d.famscroll){const tr=t.parentElement.querySelector(".fam-track"), w=tr.firstElementChild.offsetWidth+14;tr.scrollBy({left:+d.famscroll*w*Math.max(1,Math.floor(tr.clientWidth/w)),behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});return}
  if(d.zoom){galIdx=Math.max(0,CARDS.findIndex(c=>c.id===+d.zoom));openGallery();return}
  if(d.act==="gallery"){openGallery();return}
  if(d.act==="galCut"){const id=CARDS[galIdx].id, cs=cutSet();cs.has(id)?cs.delete(id):cs.add(id);S.cut=[...cs];touched();galUpdate();return}
  if(d.act==="galDetail"){galOn=false;openSheet(CARDS[galIdx].id);return}
  if(d.open){e.preventDefault();openSheet(+d.open);return}
  if(d.ostack){e.preventDefault();delConfirm=false;openStack(d.ostack);return}
  if(t.hasAttribute("data-close")){closeSheet();return}
  if(d.nav){const l=navList();const i=l.findIndex(c=>c.id===openId);openSheet(l[(i+ +d.nav+l.length)%l.length].id);return}
  if(d.set){const id=+d.id;
    if(d.set==="p"&&S.sort[id]!=="p"&&!hasWhere(id)){openSheet(id,true);toast("Say where this would happen before it goes in Now");return}
    if(S.sort[id]===d.set) delete S.sort[id]; else S.sort[id]=d.set; touched();render();return}
  if(d.restore){S.cut=S.cut.filter(x=>x!==+d.restore);touched();render();return}
  if(t.hasAttribute("data-sset")){const v=d.sset;
    if(v==="p"&&!hasWhere(openId)){toast("Say where this would happen first: a process, team and volume");const el=$(S.processes.length?"#w-proc":"#w-detail");el&&el.focus();return}
    if(v)S.sort[openId]=v;else delete S.sort[openId];touched();openSheet(openId);return}
  if(d.q){const arr=S.answers[d.q]=S.answers[d.q]||[];const v=d.opt;const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);touched();render();return}
  if(d.cat){deckFilter.cat=d.cat;render();return}
  if(d.famopen){famOpen.has(d.famopen)?famOpen.delete(d.famopen):famOpen.add(d.famopen);render();return}
  if(d.fam){const ids=CARDS.filter(c=>c.category===d.fam).map(c=>c.id), cs=cutSet();
    if(ids.some(id=>!cs.has(id))) ids.forEach(id=>cs.add(id)); else ids.forEach(id=>cs.delete(id));
    S.cut=[...cs];touched();render();return}
  if(d.cutcard){const id=+d.cutcard, cs=cutSet();cs.has(id)?cs.delete(id):cs.add(id);S.cut=[...cs];touched();render();return}
  if(d.delproc){S.processes=S.processes.filter(p=>p.id!==d.delproc);touched();render();return}
  if(d.pilot){setPilot(d.pilot);return}
  if(d.fund){S.pilot.funding=S.pilot.funding===d.fund?"":d.fund;touched();render();return}
  const st=stackById(openStackId);
  if(st){
    if(d.spat){st.pattern=st.pattern===+d.spat?null:+d.spat;touched();reopenStack();return}
    if(d.scard){const id=+d.scard, i=st.cards.indexOf(id);i>=0?st.cards.splice(i,1):st.cards.push(id);touched();reopenStack();return}
    if(d.schip){const i=st.knowledge.indexOf(d.schip);i>=0?st.knowledge.splice(i,1):st.knowledge.push(d.schip);touched();reopenStack();return}
    if(d.sone){st[d.sone]=st[d.sone]===d.v?"":d.v;touched();reopenStack();return}
    if(d.sscale){st[d.sscale]=st[d.sscale]===+d.v?0:+d.v;touched();reopenStack();return}
  }
  const a=d.act;
  if(a==="new"){S=blankState();aiOut={discover:null,explain:{},email:""};deckFilter={cat:"All",q:"",only:"all"};famOpen=new Set(Object.keys(CAT));go("workshop");toast("New workshop started");return}
  if(a==="sortRecs"){deckFilter={cat:"All",q:"",only:"recs"};go("sort");return}
  if(a==="cutCopilot"){const cs=cutSet();CARDS.forEach(c=>{if(!COPILOT_LED.test(c.products.join("|"))) cs.add(c.id)});S.cut=[...cs];touched();render();toast(`${CARDS.length-cs.size} Copilot-led cards kept`);return}
  if(a==="cutReset"){S.cut=[];touched();render();return}
  if(a==="toggleCut"){const cs=cutSet();cs.has(openId)?cs.delete(openId):cs.add(openId);S.cut=[...cs];touched();openSheet(openId);return}
  if(a==="addProc"){const p={id:uid(),name:"",owner:"",team:"",volume:""};S.processes.push(p);touched();render();const el=$("#pn-"+p.id);el&&el.focus();return}
  if(a==="newStack"||a==="stackFrom"){const s=blankStack();
    if(a==="stackFrom"){const c=byId[openId];if(c.category==="Agentic")s.pattern=c.id;else s.cards.push(c.id);s.proc=(S.where[openId]||{}).proc||"";}
    S.stacks.push(s);delConfirm=false;if(view!=="solutions"){view="solutions"}touched();render();openStack(s.id);return}
  if(a==="delStack"){delConfirm=true;reopenStack();return}
  if(a==="delStackNo"){delConfirm=false;reopenStack();return}
  if(a==="delStackYes"){S.stacks=S.stacks.filter(s=>s.id!==openStackId);if(S.pilot.stack===openStackId)S.pilot.stack="";touched();closeSheet();toast("Solution deleted");return}
  if(a==="copyMd") copy(summaryMd(),"Summary");
  if(a==="copyCsv") copy(summaryCsv(),"CSV");
  if(a==="copyJson") copy(JSON.stringify(S,null,1),"Workshop file");
  if(a==="import") loadState($("#importBox").value);
});
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(t.tagName==="SELECT") return;
  if(d.ai){AI[d.ai]=t.value;saveAI();return}
  if(t.id==="aiEmail"){aiOut.email=t.value;return}
  if(d.c){S.customer[d.c]=t.value;touched();return}
  if(d.p){const p=procById(d.pid);if(p){p[d.p]=t.value;touched()}return}
  if(d.w && openId!=null){(S.where[openId]=S.where[openId]||{proc:"",detail:""})[d.w]=t.value;touched();return}
  if(d.s && openStackId){const s=stackById(openStackId);if(s){s[d.s]=t.value;touched();const pill=$("#qualPill");if(pill){pill.textContent=qualLabel(s);pill.className="pill "+(qualCount(s)===QUAL.length?"ok":"todo")}}return}
  if(d.d){S.pilot[d.d]=t.value;touched();const pill=$("#decPill");if(pill){pill.textContent=decidedLabel();pill.className="pill "+(decided()?"ok":"todo")}return}
  if(t.id==="deckQ"){deckFilter.q=t.value;const pos=t.selectionStart;render();const n=$("#deckQ");n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="deckOnly"){deckFilter.only=t.value;render()}
  if(t.id==="ai-model"){AI.model=t.value;saveAI();aiMsg=`Using ${AI.model}.`}
  if(t.id==="w-proc"&&openId!=null){(S.where[openId]=S.where[openId]||{proc:"",detail:""}).proc=t.value;touched();openSheet(openId)}
  if(t.id==="st-proc"&&openStackId){stackById(openStackId).proc=t.value;touched()}
  if(t.id==="st-tier"&&openStackId){stackById(openStackId).tier=t.value;touched()}
  if(t.id==="d-pilot"){setPilot(t.value)}
  if(t.id==="importFile"&&t.files[0]){const fr=new FileReader();fr.onload=()=>loadState(fr.result);fr.readAsText(t.files[0])}
});
document.addEventListener("keydown",e=>{
  if(galOn){if(e.key==="Escape")closeSheet();else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();galGo(galIdx+(e.key==="ArrowRight"?1:-1))}return}
  if(openId==null&&!openStackId&&!aiSheetOn)return;if(e.key==="Escape"){closeSheet();return}
  if(openId!=null&&(e.key==="ArrowRight"||e.key==="ArrowLeft")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const l=navList();const i=l.findIndex(c=>c.id===openId);openSheet(l[(i+(e.key==="ArrowRight"?1:-1)+l.length)%l.length].id)}});

function render(){
  renderChrome();
  const V={workshop:vWorkshop,discover:vDiscover,sort:vSort,solutions:vSolutions,pilot:vPilot}[view]||vWorkshop;
  const keep={}; document.querySelectorAll(".fam-track").forEach(t=>keep[t.dataset.track]=t.scrollLeft);
  $("#main").innerHTML=`<section class="view">${V()}</section>`;
  document.querySelectorAll(".fam-track").forEach(t=>{t.scrollLeft=keep[t.dataset.track]||0;famArrows(t)});
}
function famArrows(t){const max=t.scrollWidth-t.clientWidth, [p,n]=t.parentElement.querySelectorAll(".gal-arrow");p.hidden=n.hidden=max<=1;p.disabled=t.scrollLeft<=1;n.disabled=t.scrollLeft>=max-1}
document.addEventListener("scroll",e=>{const t=e.target;if(t.classList&&t.classList.contains("fam-track"))famArrows(t)},true);
addEventListener("resize",()=>document.querySelectorAll(".fam-track").forEach(famArrows));
render();
if(AI.on) aiConnect(true);
</script>
