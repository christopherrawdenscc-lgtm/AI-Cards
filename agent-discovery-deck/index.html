<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Discovery Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workshop table — sticky step rail on top, one working surface per step, card detail opens as a side sheet. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#d8dee8; --fg:#18202c; --muted:#5a6678;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e3ecfa;
  --good:#1d7a4f; --good-soft:#e1f3ea; --warn:#a1620b; --warn-soft:#fbf0dc; --bad:#9b3434; --bad-soft:#f8e5e5;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --c-agentic:#4f6f86; --c-info:#2f6bab; --c-data:#2c7a82; --c-task:#5d6470; --c-decision:#8a6a3c; --c-visual:#6a58a8;
  --c-text:#a35a3a; --c-comm:#a83f4a; --c-speech:#8e4a91; --c-env:#3d7f4c; --c-content:#7d63b8; --c-process:#3f5f95; --c-nav:#9a7230;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --surface-2:#151a22; --line:#2c3542; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6ea2ef; --accent-ink:#0d1420; --accent-soft:#1d2c44;
  --good:#5cc495; --good-soft:#163428; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3d1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --c-agentic:#86a7bf; --c-info:#6ea2e0; --c-data:#5fb3ba; --c-task:#9aa3b0; --c-decision:#c9a46e; --c-visual:#a796e0;
  --c-text:#e09272; --c-comm:#e57d88; --c-speech:#c98bcc; --c-env:#79bd88; --c-content:#b59ee8; --c-process:#86a3d6; --c-nav:#d8ad62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --surface-2:#151a22; --line:#2c3542; --fg:#e7ecf3; --muted:#9aa6b8;
  --accent:#6ea2ef; --accent-ink:#0d1420; --accent-soft:#1d2c44;
  --good:#5cc495; --good-soft:#163428; --warn:#e3a94f; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3d1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --c-agentic:#86a7bf; --c-info:#6ea2e0; --c-data:#5fb3ba; --c-task:#9aa3b0; --c-decision:#c9a46e; --c-visual:#a796e0;
  --c-text:#e09272; --c-comm:#e57d88; --c-speech:#c98bcc; --c-env:#79bd88; --c-content:#b59ee8; --c-process:#86a3d6; --c-nav:#d8ad62;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header + steps */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand .cust{color:var(--muted);font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.tally span{font-family:var(--f-mono);font-size:.78rem;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
nav.steps{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{flex:0 0 auto;border:0;background:none;padding:9px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:7px;align-items:center}
nav.steps button .n{font-family:var(--f-mono);font-size:.75rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
nav.steps button[aria-current="step"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{padding-top:22px}
section.view{display:grid;gap:18px}
.intro{display:grid;gap:6px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--fg);padding:10px 14px;border-radius:var(--r)}
.banner b{color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* forms */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.scale{display:flex;gap:4px}
.scale button{width:34px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--f-mono)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* discover */
.qgrid{display:grid;gap:14px}
.q h3{margin-bottom:4px}
.q p{margin-bottom:10px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rec{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.rec .why{font-size:.8rem;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* deck */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{max-width:280px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc,var(--muted));margin-right:6px;vertical-align:1px}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;display:grid;grid-template-rows:auto 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.card .tab{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:color-mix(in srgb,var(--cc) 16%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--cc) 30%,var(--line));font-size:.76rem;font-weight:600;color:var(--fg)}
.card .tab .no{font-family:var(--f-mono);color:var(--muted);font-weight:400}
.card .body{padding:12px;display:grid;gap:6px;align-content:start;cursor:pointer;text-align:left;border:0;background:none}
.card .body h3{font-size:1.06rem}
.card .body p{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .acts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.card .acts button{border:0;background:none;padding:8px 4px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted)}
.card .acts button+button{border-left:1px solid var(--line)}
.card .acts button.on.p{background:var(--good-soft);color:var(--good)}
.card .acts button.on.m{background:var(--warn-soft);color:var(--warn)}
.card .acts button.on.x{background:var(--bad-soft);color:var(--bad)}
.card.st-p{border-color:var(--good)} .card.st-m{border-color:var(--warn)} .card.st-x{opacity:.62}
.card .flag{font-size:.7rem;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.sheet-grid img{width:100%;border-radius:10px;box-shadow:var(--shadow);display:block;background:var(--surface-2);aspect-ratio:552/768}
.ex{display:grid;gap:8px}
.ex div{font-size:.9rem}
.ex b{font-weight:600}
.prods{display:flex;flex-wrap:wrap;gap:5px}
.prod{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--surface)}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.st{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.st.p[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.st.m[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st.x[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.suggest{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
@media (max-width:760px){.sheet-grid{grid-template-columns:1fr}.sheet-grid img{max-width:280px}}

/* requirements list */
.reqlist{display:grid;gap:10px}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.req .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 8px;border:1px solid var(--line)}
.pill.p{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.m{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.todo{color:var(--muted)}

/* matrix */
.mx-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.mx-wrap{grid-template-columns:1fr}}
svg.mx{width:100%;height:auto;display:block}
svg.mx text{fill:var(--muted);font-family:var(--f-body)}
svg.mx .ql{font-size:12px;font-weight:600;fill:var(--fg);opacity:.75}
svg.mx .dot-l{font-size:11px;fill:var(--fg);font-family:var(--f-mono)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.86rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.num{font-family:var(--f-mono);text-align:center}
.quad{font-size:.75rem;font-weight:600;white-space:nowrap}
.q-quick{color:var(--good)} .q-strat{color:var(--accent)} .q-fill{color:var(--warn)} .q-later{color:var(--muted)}
.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.78rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<style>img{max-width:100%}[hidden]{display:none!important}</style>

ath."}],"products":["Azure AI Foundry","Agent Service","Microsoft 365 Copilot"]},{"id":8,"category":"Agentic","title":"Customer service","description":"AI Agents streamlining customer interactions, collecting information and dealing with requests to support human workers.","examples":[{"sector":"Retail","text":"Agents handle inquiries, track shipments, and initiate returns, reducing wait times and improving customer satisfaction."},{"sector":"Telecommunications","text":"AI monitors service outages, proactively contacts affected customers, and schedules technician visits without human intervention."}],"products":["Azure AI Foundry","Agent Service","Microsoft 365 Copilot"]},{"id":9,"category":"Information Management","title":"Extract information","description":"Use AI for efficient and speedy extraction of vital data from large databases or unsorted data stores, enhancing research and productivity.","examples":[{"sector":"Legal and Tax","text":"Use AI to quickly locate pertinent cases, laws, and regulations from extensive legal databases."},{"sector":"Scientific Research","text":"Implement AI to swiftly sift through scholarly articles and extract key findings."}],"products":["Azure AI Foundry","Microsoft 365 Copilot","Bing Search API","Azure AI Search","Azure Machine Learning"]},{"id":10,"category":"Information Management","title":"Retrieve information","description":"Enhance productivity by using AI to find relevant information.","examples":[{"sector":"E-Commerce","text":"Analyze user behavior and preferences to deliver precise personalized product recommendations."},{"sector":"Learning","text":"Assist students by finding specific information to help learn and study a concept."}],"products":["Microsoft 365 Copilot","Bing Search API","Azure AI Search","Azure Machine Learning","SharePoint Premium"]},{"id":11,"category":"Information Management","title":"Organize data","description":"Use AI to efficiently categorize and organize data, enhancing analysis and decision-making.","examples":[{"sector":"Healthcare","text":"Categorize patient data by symptoms, diagnosis, and treatment to aid in research and patient care."},{"sector":"Marketing","text":"Identify and group customers to target marketing efforts effectively based on their interests, shopping habits, or annual spending."}],"products":["Azure AI Search","Azure Machine Learning","SharePoint Premium","Azure AI Document Intelligence"]},{"id":12,"category":"Information Management","title":"Discover patterns","description":"Harness AI to identify patterns and relationships in data, leading to insightful analysis and decision-making.","examples":[{"sector":"Marketing","text":"Employ AI to group customers based on purchasing behavior, demographics, and preferences for targeted marketing."},{"sector":"Social Media","text":"Use AI to identify and group trending sentiments or topics, aiding sentiment analysis and trend prediction."}],"products":["Azure AI Foundry","Azure Machine Learning"]},{"id":13,"category":"Information Management","title":"Structure raw data","description":"Leverage AI to transform raw, unstructured data into a structured format for easier analysis and insights extraction.","examples":[{"sector":"Text Mining","text":"Convert unstructured text from social media, emails, or reviews into structured data for sentiment analysis or trend identification."},{"sector":"Healthcare","text":"Organize disparate, unstructured patient data into structured records, enhancing healthcare delivery and research."}],"products":["Azure AI Foundry","Azure Machine Learning","Azure AI Document Intelligence"]},{"id":14,"category":"Data and predictive analytics","title":"Gain market insights","description":"Utilize AI to understand market trends, forecast, and assess competitor behavior.","examples":[{"sector":"Retail","text":"Analyze data points to understand market trends and inform strategic decisions."},{"sector":"Marketing","text":"Track competitor's digital footprint to comprehend their function suggestPlatform(c, complexity){
  const p = c.products.join("|");
  if(/Security Copilot|Sentinel/.test(p)) return [PLATFORMS[5],"The card's product set points to the Security Copilot stack."];
  if(/GitHub/.test(p) && !/Copilot Studio/.test(p)) return [PLATFORMS[6],"Developer-facing scenario built on GitHub."];
  if(/Copilot Studio|Agents SDK|Microsoft 365 Copilot$|Microsoft 365 Copilot\|/.test(p+"|") || /Agent Service/.test(p)){
    if(complexity>=4 && /Foundry|Agents SDK/.test(p)) return [PLATFORMS[2],"Start low-code in Copilot Studio and add Foundry models or tools for the heavy lifting."];
    if(c.category==="Agentic") return [PLATFORMS[1],"Agentic scenario: Copilot Studio with autonomous triggers, grow into Foundry Agent Service if needed."];
    return [PLATFORMS[1],"Fits a low-code agent published to Microsoft 365 Copilot and Teams."];
  }
  if(/Dynamics 365|Copilot for Sales|Copilot for Service/.test(p)) return [PLATFORMS[4],"Sits on Dynamics 365 data; use its built-in Copilot and agents first."];
  if(/Power Automate|AI Builder|Power Apps|Power Pages/.test(p)) return [PLATFORMS[7],"Process automation with Power Platform, surfaced through a Copilot Studio agent."];
  return [PLATFORMS[3],"Needs custom models (vision, speech, ML or IoT). Plan a pro-code build in Azure AI Foundry."];
}

function recommendations(){

function matrixSVG(items){
  const W=520,H=400,L=46,T=16,R=14,B=44,pw=W-L-R,ph=H-T-B;
  const x=v=>L+(v-0.5)/5*pw, y=v=>T+(5.5-v)/5*ph;
  const seen={}; const pts=items.map((it,i)=>{const k=it.r.value+"-"+it.r.complexity;const n=seen[k]=(seen[k]||0)+1;const a=(n-1)*2.1;const off=n>1?11:0;return {i,cx:x(it.r.complexity)+Math.cos(a)*off,cy:y(it.r.value)+Math.sin(a)*off,it}});
  return `<svg class="mx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Value versus complexity matrix">
   <rect x="${L}" y="${T}" width="${x(3.5)-L}" height="${y(3.5)-T}" fill="var(--good-soft)"/>
   <rect x="${x(3.5)}" y="${T}" width="${L+pw-x(3.5)}" height="${y(3.5)-T}" fill="var(--accent-soft)"/>
   <rect x="${L}" y="${y(3.5)}" width="${x(3.5)-L}" height="${T+ph-y(3.5)}" fill="var(--warn-soft)"/>
   <rect x="${x(3.5)}" y="${y(3.5)}" width="${L+pw-x(3.5)}" height="${T+ph-y(3.5)}" fill="var(--surface-2)"/>
   <text class="ql" x="${L+8}" y="${T+18}">Quick wins</text><text class="ql" x="${L+pw-8}" y="${T+18}" text-anchor="end">Strategic bets</text>
   <text class="ql" x="${L+8}" y="${T+ph-8}">Fill-ins</text><text class="ql" x="${L+pw-8}" y="${T+ph-8}" text-anchor="end">Revisit later</text>
   ${[1,2,3,4,5].map(v=>`<text x="${x(v)}" y="${T+ph+16}" text-anchor="middle" font-size="11">${v}</text><text x="${L-10}" y="${y(v)+4}" text-anchor="end" font-size="11">${v}</text>`).join("")}
   <line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="var(--line)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="var(--line)"/>
   <text x="${L+pw/2}" y="${H-6}" text-anchor="middle" font-size="12">Complexity →</text>
   <text transform="translate(13 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="12">Value →</text>
   ${pts.map(p=>`<g style="cursor:pointer" data-open="${p.it.c.id}"><circle cx="${p.cx}" cy="${p.cy}" r="10" fill="var(${CAT[p.it.c.category]})" stroke="var(--surface)" stroke-width="2"><title>${esc(p.it.r.name)}</title></circle><text class="dot-l" x="${p.cx}" y="${p.cy+4}" text-anchor="middle" style="fill:#fff;font-size:10px">${p.i+1}</text></g>`).join("")}
  </svg>`;
}

/* ---------- card sheet ---------- */
let openId=null;
function openSheet(id,focusReq){
  openId=id; const c=byId[id]; const s=S.sort[id]||"";
  const r=S.reqs[id]||blankReq(c);
  const [sugg,why]=suggestPlatform(c,r.complexity||0);
  const showReq=s==="p"||s==="m";
  $("#sheetHost").innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.title)}" style="--cc:var(${CAT[c.category]})">
   <div class="sheet-h"><div class="row"><button class="btn sm" data-nav="-1" aria-label="Previous card">‹ Prev</button><button class="btn sm" data-nav="1" aria-label="Next card">Next ›</button><span class="mono muted">No. ${c.id} of ${CARDS.length}</span></div><button class="btn sm" data-close>Close</button></div>
   <div class="sheet-grid">
     <div style="display:grid;gap:10px"><img src="cards/${String(id).padStart(2,"0")}.jpg" alt="Card ${c.id}: ${esc(c.title)}" loading="lazy"></div>
     <div style="display:grid;gap:16px;min-width:0">
       <div style="display:grid;gap:6px"><span class="label"><span class="cat-dot"></span>${esc(c.category)}</span><h2>${esc(c.title)}</h2><p>${esc(c.description)}</p></div>
       <div class="ex"><span class="label">Examples</span>${c.examples.map(e=>`<div><b>${esc(e.sector)}.</b> ${esc(e.text)}</div>`).join("")}</div>
       <div style="display:grid;gap:6px"><span class="label">Microsoft products on the card</span><div class="prods">${c.products.map(p=>`<span class="prod">${esc(p)}</span>`).join("")}</div></div>
       <div style="display:grid;gap:6px"><span class="label">Does this matter to the customer?</span><div class="status-row">
         <button class="st p" data-sset="p" aria-pressed="${s==="p"}">Priority</button><button class="st m" data-sset="m" aria-pressed="${s==="m"}">Maybe</button><button class="st x" data-sset="x" aria-pressed="${s==="x"}">Not now</button>${s?`<button class="btn sm ghost" data-sset="">Clear</button>`:""}</div></div>
       ${showReq?reqForm(c,r,sugg,why):`<p class="muted" style="font-size:.88rem">Mark this card priority or maybe to capture its requirements.</p>`}
     </div></div></div>`;
  document.body.style.overflow="hidden";
  if(focusReq){const el=$("#rq-name");el&&setTimeout(()=>el.scrollIntoView({block:"center"}),30)}
}
function reqForm(c,r,sugg,why){
  const chipset=(field,opts)=>`<div class="chips">${opts.map(o=>`<button type="button" class="chip" data-rchip="${field}" data-v="${esc(o)}" aria-pressed="${r[field].includes(o)}">${esc(o)}</button>`).join("")}</div>`;
  const scale=f=>`<div class="scale" role="group">${[1,2,3,4,5].map(n=>`<button type="button" data-rscale="${f}" data-v="${n}" aria-pressed="${r[f]===n}" aria-label="${f} ${n}">${n}</button>`).join("")}</div>`;
  return `<div class="panel" style="display:grid;gap:14px" id="reqPanel">
   <div class="row" style="justify-content:space-between"><h3>Agent requirement</h3>${reqDone(c.id)?`<span class="pill ok">Captured</span>`:`<span class="pill todo">Needs problem, value and complexity</span>`}</div>
   <div class="field"><label for="rq-name">Agent name</label><input type="text" id="rq-name" data-r="name" value="${esc(r.name)}"></div>
   <div class="field"><label for="rq-problem">Business problem</label><textarea id="rq-problem" data-r="problem" placeholder="What happens today, and what does it cost them?">${esc(r.problem)}</textarea></div>
   <div class="field"><label for="rq-users">Who will use it</label><input type="text" id="rq-users" data-r="users" value="${esc(r.users)}" placeholder="Roles, teams, numbers of people"></div>
   <div class="field"><span class="lab">Agent type</span><div class="chips">${Object.entries(AGENT_TYPES).map(([k,[l,d]])=>`<button type="button" class="chip" data-rtype="${k}" aria-pressed="${r.type===k}" title="${esc(d)}">${l}</button>`).join("")}</div><span class="hint">${esc(AGENT_TYPES[r.type][1])}</span></div>
   <div class="field"><span class="lab">Knowledge and data sources</span>${chipset("knowledge",KNOWLEDGE)}</div>
   <div class="field"><label for="rq-actions">Actions and integrations</label><textarea id="rq-actions" data-r="actions" placeholder="What should the agent do, and in which systems?">${esc(r.actions)}</textarea></div>
   <div class="field"><span class="lab">Where people use it</span>${chipset("channels",CHANNELS)}</div>
   <div class="field"><label for="rq-success">Success measure</label><input type="text" id="rq-success" data-r="success" value="${esc(r.success)}" placeholder="e.g. Reduce handling time by 20%"></div>
   <div class="grid2"><div class="field"><span class="lab">Business value</span>${scale("value")}<span class="hint">1 nice to have · 5 critical</span></div>
     <div class="field"><span class="lab">Complexity</span>${scale("complexity")}<span class="hint">1 out of the box · 5 major build</span></div></div>
   <div class="suggest"><b>Suggested build path:</b> ${esc(sugg)}. <span class="muted">${esc(why)}</span></div>
   <div class="field"><label for="rq-platform">Build path</label><select id="rq-platform" data-r="platform"><option value="">Use suggestion (${esc(sugg)})</option>${PLATFORMS.map(p=>`<option ${r.platform===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
   <div class="grid2"><div class="field"><label for="rq-sponsor">Sponsor / owner</label><input type="text" id="rq-sponsor" data-r="sponsor" value="${esc(r.sponsor)}"></div>
     <div class="field"><label for="rq-notes">Notes and open questions</label><textarea id="rq-notes" data-r="notes" style="min-height:44px">${esc(r.notes)}</textarea></div></div>
  </div>`;
}
function closeSheet(){openId=null;$("#sheetHost").innerHTML="";document.body.style.overflow="";render()}
function ensureReq(id){if(!S.reqs[id]) S.reqs[id]=blankReq(byId[id]); return S.reqs[id]}
function touched(){if(S.example){/* editing the example keeps it, but it's still flagged */} save(); renderChrome();}

/* ---------- export ---------- */
function backlogRows(){return shortlist().map(c=>({c,r:S.reqs[c.id]||blankReq(c)}))}
function summaryMd(){
  const c=S.customer; const rows=backlogRows().filter(x=>x.r.value&&x.r.complexity).sort((a,b)=>(b.r.value-b.r.complexity*0.5)-(a.r.value-a.r.complexity*0.5));
  let t=`# Copilot agent discovery: ${c.name||"Customer"}\n\nDate: ${c.date||""}\nSector: ${c.sector||""}\nAttendees: ${c.attendees||""}\n\n## Business goals\n${c.goals||"-"}\n\n## What we heard\n`;
  QUESTIONS.forEach(q=>{t+=`- ${q.title} ${(S.answers[q.key]||[]).join("; ")||"-"}\n`});
  t+=`\n## Agent backlog (ranked)\n`;
  rows.forEach((x,i)=>{const r=x.r;t+=`\n### ${i+1}. ${r.name} — ${quadrant(r)[0]}\n- Card: ${x.c.id} ${x.c.title} (${x.c.category})\n- Problem: ${r.problem}\n- Users: ${r.users}\n- Agent type: ${AGENT_TYPES[r.type][0]}\n- Knowledge: ${r.knowledge.join(", ")}\n- Channels: ${r.channels.join(", ")}\n- Actions: ${r.actions}\n- Success measure: ${r.success}\n- Value ${r.value}/5, complexity ${r.complexity}/5\n- Build path: ${r.platform||suggestPlatform(x.c,r.complexity)[0]}\n- Sponsor: ${r.sponsor}\n${r.notes?`- Notes: ${r.notes}\n`:""}`});
  const un=backlogRows().filter(x=>!(x.r.value&&x.r.complexity));
  if(un.length) t+=`\n## Shortlisted, not yet scored\n`+un.map(x=>`- ${x.c.title} (card ${x.c.id})`).join("\n")+"\n";
  return t;
}
function summaryCsv(){
  const h=["Rank","Agent","Card","Category","Status","Problem","Users","Type","Knowledge","Channels","Actions","Success measure","Value","Complexity","Quadrant","Build path","Sponsor","Notes"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=backlogRows().sort((a,b)=>((b.r.value||0)-(b.r.complexity||0)*0.5)-((a.r.value||0)-(a.r.complexity||0)*0.5));
  return [h.map(q).join(","),...rows.map((x,i)=>{const r=x.r;return [i+1,r.name,x.c.id+" "+x.c.title,x.c.category,{p:"Priority",m:"Maybe"}[S.sort[x.c.id]],r.problem,r.users,AGENT_TYPES[r.type][0],r.knowledge.join("; "),r.channels.join("; "),r.actions,r.success,r.value||"",r.complexity||"",r.value&&r.complexity?quadrant(r)[0]:"",r.platform||suggestPlatform(x.c,r.complexity)[0],r.sponsor,r.notes].map(q).join(",")})].join("\n");
}
async function copy(text,label){
  try{await navigator.clipboard.writeText(text);toast(label+" copied");$("#copyFallback").innerHTML="";}
  catch(e){$("#copyFallback").innerHTML=`<p class="muted" style="font-size:.85rem">Your browser blocked the clipboard. Select the text below and copy it.</p><textarea class="copybox" readonly>${esc(text)}</textarea>`;const t=$("#copyFallback textarea");t.focus();t.select();}
}
function loadState(txt){
  try{const o=JSON.parse(txt); if(!o||!o.customer||!o.sort) throw 0; o.example=false; o.answers=o.answers||{teams:[],pains:[],data:[]}; o.reqs=o.reqs||{}; S=o; save(); render(); toast("Workshop loaded");}
  catch(e){toast("That isn't a workshop file. Copy it again from Backlog.")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-open],[data-set],[data-q],[data-cat],[data-close],[data-nav],[data-sset],[data-rchip],[data-rscale],[data-rtype]");
  if(!t) return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.open){e.preventDefault();openSheet(+t.dataset.open,t.dataset.focus==="req");return}
  if(t.hasAttribute("data-close")){closeSheet();return}
  if(t.dataset.nav){const i=CARDS.findIndex(c=>c.id===openId);const n=CARDS[(i+ +t.dataset.nav+CARDS.length)%CARDS.length];openSheet(n.id);return}
  if(t.dataset.set){const id=+t.dataset.id;S.sort[id]=S.sort[id]===t.dataset.set?undefined:t.dataset.set;if(!S.sort[id])delete S.sort[id];touched();render();return}
  if(t.hasAttribute("data-sset")){const v=t.dataset.sset;if(v)S.sort[openId]=v;else delete S.sort[openId];if(v==="p"||v==="m")ensureReq(openId);touched();openSheet(openId,v==="p"||v==="m");return}
  if(t.dataset.q){const arr=S.answers[t.dataset.q]=S.answers[t.dataset.q]||[];const v=t.dataset.opt;const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);touched();render();return}
  if(t.dataset.cat){deckFilter.cat=t.dataset.cat;render();return}
  if(t.dataset.rchip){const r=ensureReq(openId);const a=r[t.dataset.rchip];const i=a.indexOf(t.dataset.v);i>=0?a.splice(i,1):a.push(t.dataset.v);t.setAttribute("aria-pressed",i<0);touched();return}
  if(t.dataset.rscale){const r=ensureReq(openId);r[t.dataset.rscale]=+t.dataset.v;touched();const y=$(".sheet").scrollTop;openSheet(openId);$(".sheet").scrollTop=y;return}
  if(t.dataset.rtype){const r=ensureReq(openId);r.type=t.dataset.rtype;touched();const y=$(".sheet").scrollTop;openSheet(openId);$(".sheet").scrollTop=y;return}
  const a=t.dataset.act;
  if(a==="new"){S=blankState();deckFilter={cat:"All",q:"",only:"all"};go("workshop");toast("New workshop started");return}
  if(a==="sortRecs"){deckFilter={cat:"All",q:"",only:"recs"};go("sort");return}
  if(a==="copyMd") copy(summaryMd(),"Summary");
  if(a==="copyCsv") copy(summaryCsv(),"CSV");
  if(a==="copyJson") copy(JSON.stringify(S,null,1),"Workshop file");
  if(a==="import") loadState($("#importBox").value);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.c){S.customer[t.dataset.c]=t.value;touched();return}
  if(t.dataset.r && openId){ensureReq(openId)[t.dataset.r]=t.value;touched();return}
  if(t.id==="deckQ"){deckFilter.q=t.value;const pos=t.selectionStart;render();const n=$("#deckQ");n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="deckOnly"){deckFilter.only=t.value;render()}
  if(t.id==="rq-platform"){ensureReq(openId).platform=t.value;touched()}
  if(t.id==="importFile"&&t.files[0]){const fr=new FileReader();fr.onload=()=>loadState(fr.result);fr.readAsText(t.files[0])}
});
document.addEventListener("keydown",e=>{if(openId==null)return;if(e.key==="Escape")closeSheet();
  if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const i=CARDS.findIndex(c=>c.id===openId);openSheet(CARDS[(i+(e.key==="ArrowRight"?1:-1)+CARDS.length)%CARDS.length].id)}});

function render(){
  renderChrome();
  const V={workshop:vWorkshop,discover:vDiscover,sort:vSort,capture:vCapture,backlog:vBacklog}[view]||vWorkshop;
  $("#main").innerHTML=`<section class="view">${V()}</section>`;
}
render();
</script>

</body>
</html>
